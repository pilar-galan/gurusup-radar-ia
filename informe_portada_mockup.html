:root{--canvas:#FCFCF8;--fg:#1D1E1A;--muted:#6E6C60;--border:#E5E5E5;--primary:#2ECF8F;--primary-ink:#1B8A5E;
  --sans:'Geist',sans-serif;--mono:'Geist Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:1500px}
body{background:var(--canvas);font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.stage{position:absolute;inset:0}

/* top chrome */
.top{position:absolute;left:96px;right:96px;top:80px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:30px;height:30px;color:var(--fg);display:block}
.brand .w{font-weight:600;font-size:27px;letter-spacing:-.5px}
.ey{font-family:var(--mono);font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary-ink);display:flex;align-items:center;gap:10px}
.ey .s{width:12px;height:12px;background:var(--primary)}

/* documents */
.doc{position:absolute;background:#fff;border:1px solid var(--border);overflow:hidden}
.doc img{display:block;width:100%;height:100%}
.back{left:470px;top:372px;width:452px;height:640px;transform:rotate(7deg);
  box-shadow:0 24px 50px -22px rgba(29,30,26,.30);z-index:1}
.mid{left:166px;top:322px;width:520px;height:736px;box-shadow:0 10px 22px -14px rgba(29,30,26,.25);z-index:2}
.front{left:150px;top:306px;width:520px;height:736px;box-shadow:0 40px 70px -26px rgba(29,30,26,.45);z-index:3}

/* page-count tab sticking up from the top-right of the cover (bookmark) */
.tab{position:absolute;z-index:4;left:486px;top:262px;background:var(--primary);color:#1D1E1A;
  font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:.02em;padding:9px 16px;
  box-shadow:0 10px 24px -12px rgba(46,207,143,.7)}

/* bottom caption */
.foot{position:absolute;left:96px;right:96px;bottom:78px;display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--border);padding-top:22px}
.foot .site{font-family:var(--mono);font-size:20px;color:var(--fg)}
.foot .site b{color:var(--primary-ink);font-weight:500}
.foot .meta{font-family:var(--mono);font-size:17px;color:var(--muted)}
.title{position:absolute;left:96px;right:96px;bottom:150px;text-align:center}
.title h2{font-weight:600;font-size:30px;letter-spacing:-.5px}
.title p{font-size:18px;color:var(--muted);margin-top:8px}
</style></head>
