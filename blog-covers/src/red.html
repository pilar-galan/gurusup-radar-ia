<link rel="stylesheet" href="base.css">
<style>
.stage{background:
  radial-gradient(680px 520px at 84% 50%, rgba(46,207,143,.20), transparent 70%),
  radial-gradient(520px 420px at 6% 92%, rgba(46,207,143,.10), transparent 72%),
  #021f12;}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1.1px, transparent 1.1px);background-size:26px 26px;mask-image:linear-gradient(105deg,transparent 8%,#000 55%);}
.frame{position:absolute;inset:26px;border:1px solid rgba(46,207,143,.22);border-radius:22px}
.copy{position:absolute;left:82px;top:158px;width:560px}
.eyebrow{color:#2ECF8F}
.eyebrow span{color:rgba(255,255,255,.42)}
h1{color:#fff;font-size:82px;margin:26px 0 0}
h1 em{font-style:normal;color:#2ECF8F}
.sub{margin-top:24px;color:rgba(255,255,255,.7);font-size:23px;font-weight:500;line-height:1.42;max-width:470px}
.rule{margin-top:34px;display:flex;align-items:center;gap:14px}
.rule i{display:block;width:64px;height:3px;border-radius:3px;background:#2ECF8F}
.rule b{color:rgba(255,255,255,.5);font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
svg{position:absolute;right:8px;top:0}
.nl{font:600 13.5px Manrope;fill:rgba(255,255,255,.72);letter-spacing:.02em}
</style>
<div class="stage">
  <div class="dots"></div>
  <div class="frame"></div>
  <svg width="620" height="630" viewBox="0 0 620 630">
    <defs>
      <radialGradient id="core" cx="38%" cy="32%" r="72%">
        <stop offset="0" stop-color="#7dffc4"/><stop offset="60%" stop-color="#2ECF8F"/><stop offset="100%" stop-color="#18a26c"/>
      </radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2ECF8F" stop-opacity=".85"/><stop offset="1" stop-color="#2ECF8F" stop-opacity=".18"/>
      </linearGradient>
    </defs>
    <g transform="translate(300,315)">
      <circle r="248" fill="none" stroke="rgba(46,207,143,.13)"/>
      <circle r="196" fill="none" stroke="rgba(46,207,143,.20)"/>
      <circle r="196" fill="none" stroke="rgba(46,207,143,.55)" stroke-dasharray="3 13" stroke-linecap="round"/>
      <circle r="118" fill="none" stroke="rgba(255,255,255,.14)"/>
      <g stroke="url(#ln)" stroke-width="1.6">
        <line x1="0" y1="0" x2="0" y2="-196"/><line x1="0" y1="0" x2="186" y2="-62"/>
        <line x1="0" y1="0" x2="115" y2="159"/><line x1="0" y1="0" x2="-115" y2="159"/>
        <line x1="0" y1="0" x2="-186" y2="-62"/>
      </g>
      <g filter="url(#glow)"><circle r="52" fill="url(#core)"/></g>
      <circle r="52" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>
      <g fill="none" stroke="#021f12" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-17 8 L-17 -6 A17 17 0 0 1 17 -6 L17 8"/>
        <rect x="-21" y="6" width="42" height="17" rx="6" fill="#021f12" stroke="none"/>
        <circle cx="-8" cy="14.5" r="2.6" fill="#2ECF8F" stroke="none"/><circle cx="8" cy="14.5" r="2.6" fill="#2ECF8F" stroke="none"/>
        <path d="M0 -23 L0 -33"/><circle cx="0" cy="-37" r="4.2" fill="#021f12" stroke="none"/>
      </g>
      <g>
        <g transform="translate(0,-196)"><circle r="27" fill="#04301c" stroke="#2ECF8F" stroke-width="1.6"/><circle r="6" fill="#2ECF8F"/><text class="nl" y="-42" text-anchor="middle">Objetivo</text></g>
        <g transform="translate(186,-62)"><circle r="27" fill="#04301c" stroke="#2ECF8F" stroke-width="1.6"/><circle r="6" fill="#2ECF8F"/><text class="nl" x="0" y="49" text-anchor="middle">Herramientas</text></g>
        <g transform="translate(115,159)"><circle r="27" fill="#04301c" stroke="#2ECF8F" stroke-width="1.6"/><circle r="6" fill="#2ECF8F"/><text class="nl" y="49" text-anchor="middle">Acción</text></g>
        <g transform="translate(-115,159)"><circle r="27" fill="#04301c" stroke="#2ECF8F" stroke-width="1.6"/><circle r="6" fill="#2ECF8F"/><text class="nl" y="49" text-anchor="middle">Memoria</text></g>
        <g transform="translate(-186,-62)"><circle r="27" fill="#04301c" stroke="#2ECF8F" stroke-width="1.6"/><circle r="6" fill="#2ECF8F"/><text class="nl" y="-40" text-anchor="middle">Contexto</text></g>
      </g>
    </g>
  </svg>
  <div class="copy">
    <div class="eyebrow">GuruSup <span>· IA aplicada</span></div>
    <h1>Agentes<br>de <em>IA</em></h1>
    <p class="sub">Qué son, cómo razonan y por qué cambian la forma de trabajar de un equipo.</p>
    <div class="rule"><i></i><b>Guía práctica</b></div>
  </div>
</div>
